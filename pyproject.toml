[project]
name = "agentic-knowledge-assistant"
version = "0.1.0"
description = "Agentic RAG assistant for enterprise knowledge bases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pgvector>=0.2.5",
    "PyYAML>=6.0.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7.3",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.bandit]
exclude_dirs = [".venv", ".notes", "reports", "tests"]
