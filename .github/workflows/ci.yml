name: CI

on:
  push:
  pull_request:

jobs:
  local-checks:
    name: Local checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run smoke checks
        run: python scripts/smoke_check.py --with-tests

      - name: Run security audit
        run: make audit

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t agentic-knowledge-assistant:ci .
