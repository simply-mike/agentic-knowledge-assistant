name: CI

on:
  push:
  pull_request:

jobs:
  local-checks:
    name: Local checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.18"
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run smoke checks
        run: uv run --locked python scripts/smoke_check.py --with-tests

      - name: Run security audit
        run: make audit

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t agentic-knowledge-assistant:ci .
